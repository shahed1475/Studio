    <label class="tick"><input type="checkbox" id="or_on" ${cfg.enabled?"checked":""} onchange="editing=true"> Use paid OpenRouter models for the jobs below</label>
    <datalist id="or_models">${L.models.map(x=>`<option value="${esc(x.id)}">${esc(x.id)} (in $${x.in}, out $${x.out} per million tokens)</option>`).join("")}</datalist>
    ${["script","review","cheap"].map(r=>{const pr=L.role_prices[r];return `<div><label for="or_${r}">${ROLE_LABEL[r][0]}</label><input id="or_${r}" list="or_models" value="${esc(cfg.models[r])}" placeholder="Model ID from openrouter.ai/models (empty = local model)" oninput="editing=true"><div class="help">${ROLE_LABEL[r][1]} ${pr?(cfg.models[r]?`Price: $${pr[0].toFixed(2)} in, $${pr[1].toFixed(2)} out per million tokens. `:"Local model: free. "):`<span style="color:var(--bad)">Model ID not found in OpenRouter's list.</span> `}${cfg.models[r]?`<button class="btn quiet sm" onclick="llmTest('${r}')">Test it</button> <span id="t_${r}" class="mute"></span>`:""}</div></div>`}).join("")}
    <div class="fld"><div><label for="or_cap">Daily cap (US dollars)</label><input id="or_cap" type="number" min="0.05" max="100" step="0.05" value="${cfg.daily_budget_usd}" oninput="editing=true"><div class="help">A hard stop. Every call after it uses the local model.</div></div>
      <div><label for="or_max">Longest answer (tokens)</label><input id="or_max" type="number" min="500" max="16000" step="500" value="${cfg.max_output_tokens}" oninput="editing=true"><div class="help">Limits what one call can cost.</div></div></div>
    <div><button class="btn" onclick="llmSave()">Save AI settings</button></div>
    ${L.fallbacks.length?`<div class="err">${L.fallbacks.map(esc).join("<br>")}</div>`:""}
    <div><h2 style="font-size:15px;margin:6px 0 8px">What it costs for this channel</h2>
    ${est?`<div class="panel rows" style="box-shadow:none"><div><span class="grow">One documentary</span><span class="mono">${usd(est.per_doc_usd)}</span></div><div><span class="grow">One Short</span><span class="mono">${usd(est.per_short_usd)}</span></div><div><span class="grow">Each day (${L.plan.docs_per_day} documentary, ${L.plan.shorts_per_day} Short)</span><span class="mono">${usd(est.per_day_usd)}</span></div><div><span class="grow">Weekly news and trend research</span><span class="mono">${usd(est.weekly_usd)}</span></div><div><b class="grow">Each month</b><b class="mono">${usd(est.per_month_usd)}</b></div></div>
    <p class="help">Estimated from typical prompt sizes and the prices above. The real spend shows at the top of this panel. The daily cap protects you if the estimate is low.</p>`:`<p class="help">Pick models that exist on OpenRouter to see an estimate.</p>`}</div>
    ${L.history.length?`<div class="mute">Last days: ${L.history.map(d=>`${esc(d.day.slice(5))} ${usd(d.usd)}`).join(", ")}</div>`:""}</div>`:"";
  m.innerHTML=`<div class="head"><h1>Settings</h1><p class="sub">Keys are stored in settings.json next to the project, readable only by you.</p></div>${aiPanel}
  <div class="panel pad stack"><h2>Pexels API key (optional)</h2>
    <p class="sub">Shorts use public-domain archive images by default. A Pexels key adds moving stock video, but Pexels has paused new keys. Free at <a target="_blank" rel="noopener" href="https://www.pexels.com/api/">pexels.com/api</a>. ${S.settings.pexels_key?`Current key: <span class="mono">${esc(S.settings.pexels_key)}</span>`:"No key saved yet."}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><div class="grow"><label for="pk" style="position:absolute;left:-9999px">Pexels key</label><input id="pk" placeholder="Paste your key" oninput="editing=true"></div><button class="btn" onclick="savePk()">Save key</button></div></div>
  <div class="panel pad stack" style="margin-top:16px"><h2>Pipeline</h2>
    <div class="rows" style="margin:0 -20px -20px">
      <div><span class="grow">Voice</span><span class="mono mute">${esc(h.voice)}</span></div>
      <div><span class="grow">Script model</span><span class="mono mute">${esc(h.model)}</span></div>
      <div><span class="grow">Free disk space</span><span class="mono mute">${h.disk_free_gb} GB</span></div>
    </div>
    <p class="help">Rules kept on purpose: every video needs your approval, uploads are labelled as AI-narrated, uploads default to private, at most 5 uploads a day. Change voice or model with the YT_VOICE and YT_MODEL environment variables, and the niche in niche.json.</p></div>`;
}
async function llmSave(){
  const g=id=>document.getElementById(id),body={free:g("or_free").checked,free_daily_limit:parseInt(g("or_flim").value,10),enabled:g("or_on").checked,daily_budget_usd:parseFloat(g("or_cap").value),max_output_tokens:parseInt(g("or_max").value,10),models:{script:g("or_script").value.trim(),review:g("or_review").value.trim(),cheap:g("or_cheap").value.trim()}};
  const k=g("or_key").value.trim();if(k)body.key=k;
  await api("/api/llm/config",body);editing=false;toast("AI settings saved");render(true)}
async function llmClearKey(){if(!confirm("Remove the saved OpenRouter key? OpenRouter will be turned off."))return;await api("/api/llm/config",{enabled:false,clear_key:true});editing=false;toast("Key removed");render(true)}
async function llmTest(role){const el=document.getElementById("t_"+role);el.textContent="Testing...";try{const r=await api("/api/llm/test",{role});el.innerHTML=r.ok?`Works. ${r.seconds} s, cost ${usd(r.usd)}`:`<span style="color:var(--bad)">${esc(r.error)}</span>`}catch(e){el.textContent=""}}
async function savePk(){const v=document.getElementById("pk").value;if(!v.trim())return toast("Paste a key first");await api("/api/settings",{pexels_key:v});editing=false;toast("Key saved");refresh(true)}

window.addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(t&&t!==tab&&NAV.some(n=>n[0]===t)){tab=t;render(true)}});
refresh(true);setInterval(()=>refresh(),4000);
